[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "imgorg"
version = "0.1.0"
description = "Organize images by date and detect exact and visually similar duplicates"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "Pillow>=11,<13",
    "pillow-heif>=1,<2",
    "ImageHash>=4.3,<5",
]

[project.scripts]
imgorg = "organize_images:main"

[tool.setuptools]
py-modules = ["organize_images", "path_utils", "persistence", "similarity"]
